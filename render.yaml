services:
  - type: worker
    name: txt-editor-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: FORCE_SUB_CHANNEL
        value: "@inventor_king_24"
      - key: FORCE_SUB_URL
        value: "https://t.me/inventor_king_24"
      - key: MAX_FILE_MB
        value: "20"
